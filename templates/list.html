{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="page-header">
    <h1>{{ title }}</h1>
</header>
<ul class="article-list">
    {% for post in posts %}
    <li>
        <time datetime="{{ post.date }}">{{ post.display_date }}</time>
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <p>{{ post.description }}</p>
    </li>
    {% endfor %}
</ul>
{% endblock %}
