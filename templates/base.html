<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Professional Data Leadership{% endblock %}</title>
    <link rel="stylesheet" href="{{ base_path }}/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-container">
            <a href="{{ base_path }}/" class="site-title">Data Leadership</a>
            <nav class="site-nav">
                <a href="{{ base_path }}/">Home</a>
                <a href="{{ base_path }}/articles/">Articles</a>
                <a href="{{ base_path }}/about/">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Data Leadership Blog. Built with a custom Python static generator.</p>
        </div>
    </footer>
	
<!-- GoatCounter Analytics -->
<script data-goatcounter="https://garymanleydata.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</body>
</html>
