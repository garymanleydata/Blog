{% extends "base.html" %}
{% block title %}Tag: {{ tag }} - Data Leadership{% endblock %}

{% block content %}
<header class="page-header">
    <p class="category-tag">Tag</p>
    <h1>{{ tag }}</h1>
</header>

<ul class="article-list">
    {% for post in posts %}
    <li>
        <time datetime="{{ post.date }}">{{ post.display_date }}</time>
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
        <p>{{ post.description }}</p>
    </li>
    {% endfor %}
</ul>
{% endblock %}
